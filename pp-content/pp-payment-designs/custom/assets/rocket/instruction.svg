<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C3494" />
      <stop offset="100%" stop-color="#5B1863" />
    </linearGradient>
  </defs>
  <rect width="400" height="120" rx="16" fill="url(#rocketGrad)" />
  <!-- Step 1 -->
  <g transform="translate(30, 20)">
    <circle cx="30" cy="30" r="22" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="30" cy="30" r="16" fill="#FFFFFF" />
    <text x="30" y="35" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#8C3494" text-anchor="middle">1</text>
    <text x="30" y="72" font-family="-apple-system, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">Rocket App</text>
  </g>
  <!-- Arrow 1 -->
  <path d="M 105 50 L 125 50 M 120 44 L 126 50 L 120 56" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6" />
  <!-- Step 2 -->
  <g transform="translate(145, 20)">
    <circle cx="30" cy="30" r="22" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="30" cy="30" r="16" fill="#FFFFFF" />
    <text x="30" y="35" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#8C3494" text-anchor="middle">2</text>
    <text x="30" y="72" font-family="-apple-system, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">Send Money</text>
  </g>
  <!-- Arrow 2 -->
  <path d="M 220 50 L 240 50 M 235 44 L 241 50 L 235 56" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6" />
  <!-- Step 3 -->
  <g transform="translate(260, 20)">
    <circle cx="30" cy="30" r="22" fill="#FFFFFF" fill-opacity="0.2" />
    <circle cx="30" cy="30" r="16" fill="#FFFFFF" />
    <text x="30" y="35" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#8C3494" text-anchor="middle">3</text>
    <text x="30" y="72" font-family="-apple-system, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">Enter Number</text>
  </g>
</svg>
